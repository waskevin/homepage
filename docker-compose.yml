version: "3.8"
services:
  homepage:
    image: gethomepage/homepage:v2.8.0
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "11003:3000"
    volumes:
      - ./config:/app/config
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "(command -v curl >/dev/null && curl -fsS http://127.0.0.1:3000/) || (command -v wget >/dev/null && wget -q -O /dev/null http://127.0.0.1:3000/) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
x-app-meta:
  web:
    port: 11003
    protocol: http
